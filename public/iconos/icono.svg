<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2558"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="muneco" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="370">
      <stop offset="0" stop-color="#fcd116"/>
      <stop offset="1" stop-color="#ef3340"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <!-- Franja con la bandera de Colombia -->
  <rect x="0" y="430" width="512" height="41" fill="#fcd116"/>
  <rect x="0" y="471" width="512" height="21" fill="#003893"/>
  <rect x="0" y="492" width="512" height="20" fill="#ce1126"/>
  <!-- Horca -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round" fill="none">
    <line x1="130" y1="390" x2="300" y2="390"/>
    <line x1="170" y1="390" x2="170" y2="110"/>
    <line x1="170" y1="110" x2="320" y2="110"/>
    <line x1="320" y1="110" x2="320" y2="150"/>
  </g>
  <!-- Muñeco -->
  <g stroke="url(#muneco)" stroke-width="18" stroke-linecap="round" fill="none">
    <circle cx="320" cy="185" r="35"/>
    <line x1="320" y1="220" x2="320" y2="300"/>
    <line x1="320" y1="240" x2="282" y2="275"/>
    <line x1="320" y1="240" x2="358" y2="275"/>
    <line x1="320" y1="300" x2="288" y2="350"/>
    <line x1="320" y1="300" x2="352" y2="350"/>
  </g>
</svg>
